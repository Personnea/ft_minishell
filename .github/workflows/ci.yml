name: CI - build and test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev libncurses-dev valgrind

      - name: Build (make)
        run: |
          set -o pipefail
          mkdir -p ci_logs
          make 2>&1 | tee ci_logs/build.log
        continue-on-error: false

      - name: Run comprehensive test suite
        run: |
          if [ ! -x minishell ]; then
            echo "COMPILE: FAIL - minishell executable missing"
            exit 1
          fi
          chmod +x tests/test_minishell.sh
          bash tests/test_minishell.sh 2>&1 | tee ci_logs/test_results.log
        continue-on-error: false

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minishell-ci-logs
          path: ci_logs
